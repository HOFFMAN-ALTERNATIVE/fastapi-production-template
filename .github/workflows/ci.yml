name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - name: pip-audit (resolved dependencies)
        run: python -m pip install --upgrade pip pip-audit && pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Migrations apply and roll back cleanly on Postgres
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests against Postgres
        run: pytest
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run full stack
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=compose-smoke-secret-123/' .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/health/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -X POST localhost:8000/api/v1/auth/register -H 'content-type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-1"}'
          TOKEN=$(curl -fsS -X POST localhost:8000/api/v1/auth/login \
            -d 'username=smoke@example.com&password=smoke-password-1' | jq -r .access_token)
          curl -fsS -X POST localhost:8000/api/v1/items -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"title":"hello"}'
          curl -fsS localhost:8000/metrics | grep -q http_requests_total
          docker compose exec -T api id -u | grep -q 10001
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
